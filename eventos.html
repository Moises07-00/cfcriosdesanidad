<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Iglesia Ríos de Sanidad</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <img src="logo.png" alt="Logo" class="logo">
            <div class="title-wrapper">
                <h1>Iglesia Ríos de Sanidad</h1>
                <p>Sirviendo al Señor con alegría</p>
            </div>
        </div>
    </header>

    <nav class="navbar">
        <div class="container nav-container">
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Inicio</a></li>

                <li><a href="eventos.html" class="nav-link active">Eventos</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        
        <section class="events-section">
            <div class="section-title-container">
                <h2><i class="far fa-calendar-check"></i> Próximos Eventos</h2>
                <p>Prepárate para lo que Dios hará.</p>
            </div>
            <div id="upcoming-events" class="events-grid"></div>
        </section>

        <hr class="divider">

        <section class="events-section past-section">
            <div class="section-title-container">
                <h2><i class="fas fa-history"></i> Eventos Pasados</h2>
                <p>Recordando las bendiciones recibidas.</p>
            </div>
            <div id="past-events" class="events-grid"></div>
        </section>

    <footer>
